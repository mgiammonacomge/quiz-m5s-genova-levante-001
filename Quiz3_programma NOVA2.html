<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Quiz: Il Programma M5S votato a NOVA 2026" />
  <meta property="og:description" content="Mettiti alla prova sulle linee guida, transizione ecologica e diritti approvati a NOVA." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://mgiammonacomge.github.io/quiz-m5s-genova-levante-001/Quiz_M5S.html/bandiera_5stelle.gif" />
  <title>Quiz: Il Programma M5S votato a NOVA 2026</title>
  <style>
    :root {
      --primary: #d99b00;
      --primary-dark: #b38000;
      --primary-light: #fff8e1;
      --bg-body: #faf0c2;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      
      --correct-bg: #ecfdf5;
      --correct-border: #10b981;
      --correct-text: #065f46;
      
      --wrong-bg: #fef2f2;
      --wrong-border: #ef4444;
      --wrong-text: #991b1b;
      
      --star-active: #f59e0b;
      --star-inactive: #cbd5e1;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 40px 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background-image: url('5Stelle.png');
      background-repeat: repeat;
      background-position: top left;
      background-size: 420px 420px;
      opacity: 0.14;
      pointer-events: none;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      background: var(--surface);
      padding: 32px 28px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      border-top: 5px solid var(--primary);
      box-shadow: var(--shadow-md);
      margin-bottom: 28px;
      text-align: center;
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 580px;
      margin: 0 auto 16px auto;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border-hover);
    }

    .card-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .question-category {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--primary-dark);
      background-color: var(--primary-light);
      padding: 4px 10px;
      border-radius: 9999px;
    }

    .hint-toggle-btn {
      background: #f8fafc;
      border: 1px solid var(--border);
      color: var(--primary-dark);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .hint-toggle-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--text-main);
    }

    .hint-box {
      display: none;
      background: #fffdf5;
      border: 1px dashed var(--primary);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 0.9rem;
      color: #78350f;
      margin-bottom: 16px;
      animation: fadeIn 0.25s ease-in;
    }

    .hint-box.show {
      display: block;
    }

    .hint-title {
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .question-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-secondary);
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      background: #fafafa;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 500;
      transition: all 0.15s ease-in-out;
      outline: none;
    }

    .option-btn:hover:not(:disabled) {
      background: #ffffff;
      border-color: var(--primary);
      color: var(--text-main);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .option-btn:focus-visible {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(217, 155, 0, 0.25);
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.9;
    }

    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      font-weight: 600;
      transform: none !important;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text) !important;
      transform: none !important;
    }

    .feedback-banner {
      margin-top: 16px;
      padding: 12px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      display: none;
      animation: fadeIn 0.25s ease-in;
    }

    .feedback-banner.show {
      display: flex;
      align-items: center;
    }

    .feedback-banner.correct {
      background-color: var(--correct-bg);
      color: var(--correct-text);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-left: 4px solid var(--correct-border);
    }

    .feedback-banner.wrong {
      background-color: var(--wrong-bg);
      color: var(--wrong-text);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-left: 4px solid var(--wrong-border);
    }

    .explanation-box {
      display: none;
      margin-top: 14px;
      padding: 14px 18px;
      font-size: 0.92rem;
      line-height: 1.55;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-left: 4px solid var(--correct-border);
      border-radius: var(--radius-sm);
      color: #14532d;
      animation: fadeIn 0.3s ease-in;
    }

    .explanation-box.show {
      display: block;
    }

    .explanation-box strong {
      display: block;
      margin-bottom: 4px;
      color: #166534;
      font-size: 0.95rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Score Section & Star Rating */
    #score-section {
      display: none;
      background: var(--surface);
      padding: 36px 24px;
      border-radius: var(--radius-lg);
      text-align: center;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      margin-top: 32px;
      animation: fadeIn 0.3s ease-out;
    }

    #score-section.show {
      display: block;
    }

    .score-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .stars-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
    }

    .star-icon {
      width: 44px;
      height: 44px;
      fill: var(--star-inactive);
      transition: fill 0.3s ease, transform 0.3s ease;
    }

    .star-icon.active {
      fill: var(--star-active);
    }

    .stars-wrapper.shining .star-icon {
      fill: #ffbf00;
      filter: drop-shadow(0 0 8px rgba(255, 191, 0, 0.75));
      animation: pulseGlow 1.8s infinite alternate ease-in-out;
    }

    .stars-wrapper.shining .star-icon:nth-child(1) { animation-delay: 0.0s; }
    .stars-wrapper.shining .star-icon:nth-child(2) { animation-delay: 0.15s; }
    .stars-wrapper.shining .star-icon:nth-child(3) { animation-delay: 0.3s; }
    .stars-wrapper.shining .star-icon:nth-child(4) { animation-delay: 0.45s; }
    .stars-wrapper.shining .star-icon:nth-child(5) { animation-delay: 0.6s; }

    @keyframes pulseGlow {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 4px rgba(255, 191, 0, 0.5));
      }
      100% {
        transform: scale(1.15);
        filter: drop-shadow(0 0 14px rgba(255, 191, 0, 0.95));
      }
    }

    .score-rating-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    #score-feedback {
      font-size: 1rem;
      max-width: 480px;
      margin: 0 auto 24px auto;
    }

    .restart-btn {
      background: var(--text-main);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .restart-btn:hover {
      background: #1e293b;
      transform: translateY(-1px);
    }

    .restart-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Quiz: Il Programma M5S votato a NOVA 2026</h1>
      <p>Verifica le proposte su transizione ecologica, diritti sociali e democrazia partecipativa approvate dalla comunità.</p>
      <img 
          src="bandiera_5stelle.gif" 
          alt="Bandiera Movimento 5 Stelle che sventola" 
          width="200" 
          height="150"
          loading="eager"
        >
    </header>

    <div id="quiz-container"></div>

    <section id="score-section">
      <h2 class="score-title" id="score-heading">Quiz Completato!</h2>
      
      <div class="stars-wrapper" id="stars-display"></div>
      
      <div class="score-rating-text" id="score-rating-label">Valutazione: 0 / 5 Stelle</div>
      <p id="score-feedback" style="color: var(--text-muted);"></p>
      
      <button class="restart-btn" onclick="initQuiz()">Ricomincia il quiz</button>
    </section>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        category: "Domanda 1: Sovranità Energetica e Transizione Ecologica",
        question: "Secondo il programma NOVA, quale traguardo ambizioso si pone il Movimento per rafforzare la sovranità energetica entro il 2030?",
        hint: "Pensa alla drastica riduzione dei combustibili fossili e all'accelerazione sulla produzione di energia pulita sul territorio nazionale per tagliare la dipendenza estera e le bollette.",
        explanation: "Questo obiettivo punta a una vera indipendenza energetica, abbattendo i costi delle bollette e accelerando la transizione ecologica necessaria per il Paese.",
        options: [
          { text: "A) Investire esclusivamente nel raddoppio delle importazioni di gas naturale dai paesi extra-UE.", correct: false },
          { text: "B) Costruire nuove centrali a carbone per coprire il fabbisogno energetico immediato.", correct: false },
          { text: "C) Incrementare di 50 GW la potenza da fonti rinnovabili per risparmiare 10 miliardi di euro l'anno di gas.", correct: true },
          { text: "D) Privatizzare la gestione delle reti elettriche per ridurre i costi di manutenzione dello Stato.", correct: false }
        ]
      },
      {
        id: 2,
        category: "Domanda 2: Capitale di Partenza e Giustizia Fiscale",
        question: "Come viene finanziata la proposta del 'Capitale di partenza' di 15.000 euro per i giovani diciottenni appartenenti a famiglie con redditi medi e bassi?",
        hint: "Considera il principio della progressività tributaria e della redistribuzione della ricchezza accumulata dalle fasce economicamente più agiate.",
        explanation: "Si tratta di una misura di redistribuzione della ricchezza che colpisce i privilegi delle grandi eredità per finanziare il futuro e l'autonomia delle nuove generazioni.",
        options: [
          { text: "A) Aumentando l'IVA sui beni di consumo di prima necessità per tutti i cittadini.", correct: false },
          { text: "B) Prelevando fondi direttamente dal sistema dei bonus sociali per l'energia.", correct: false },
          { text: "C) Mediante l'emissione di nuovi titoli di debito pubblico senza coperture strutturali.", correct: false },
          { text: "D) Attraverso una riforma progressiva dell'imposta sulle successioni e donazioni sui grandi patrimoni.", correct: true }
        ]
      },
      {
        id: 3,
        category: "Domanda 3: Sanità Pubblica e Governance Ospedaliera",
        question: "In tema di sanità pubblica, quale azione è ritenuta fondamentale nel programma NOVA per garantire che la salute sia un diritto e non un privilegio?",
        hint: "Rifletti sull'eliminazione delle ingerenze dei partiti e delle logiche di spartizione partitica nella gestione degli ospedali e delle ASL.",
        explanation: "Eliminare l'influenza dei partiti dalle nomine assicura che gli ospedali siano gestiti da persone competenti che rispondono ai cittadini e non ai capi bastone della politica.",
        options: [
          { text: "A) Considerare la prevenzione sanitaria come un costo da tagliare per rispettare i vincoli di bilancio europei.", correct: false },
          { text: "B) Introdurre nuove polizze assicurative obbligatorie gestite da grandi gruppi bancari.", correct: false },
          { text: "C) Svincolare le nomine dei dirigenti sanitari dalla politica, basandole esclusivamente sul merito.", correct: true },
          { text: "D) Aumentare i tetti alle assunzioni per favorire la mobilità verso le cliniche private convenzionate.", correct: false }
        ]
      },
      {
        id: 4,
        category: "Domanda 4: Lavoro Dignitoso e Qualità della Vita",
        question: "Quale pilastro della proposta sul 'Lavoro Dignitoso' punta a migliorare la qualità della vita dei cittadini senza ridurre il loro potere d'acquisto?",
        hint: "Pensa al bilanciamento tra vita privata e attività lavorativa, abilitato dalle tecnologie moderne e già sperimentato con successo in diversi paesi europei.",
        explanation: "Questa misura riconosce il valore del tempo della persona e adegua il mondo del lavoro alle nuove tecnologie, mantenendo la dignità economica dei lavoratori.",
        options: [
          { text: "A) Eliminazione del salario minimo per favorire la contrattazione individuale tra dipendente e datore.", correct: false },
          { text: "B) Incentivazione del lavoro straordinario obbligatorio per aumentare la produttività aziendale.", correct: false },
          { text: "C) Liberalizzazione selvaggia dei contratti a termine senza obbligo di indicare la causale.", correct: false },
          { text: "D) Riduzione dell'orario di lavoro a parità di salario e promozione dello smart-working.", correct: true }
        ]
      },
      {
        id: 5,
        category: "Domanda 5: Democrazia Partecipativa nei Territori",
        question: "Per quanto riguarda la democrazia partecipativa, quale obbligo verrebbe introdotto per Regioni e Comuni secondo le proposte votate nel percorso NOVA?",
        hint: "Valuta gli strumenti di democrazia diretta che permettono alla cittadinanza di scegliere come destinare e allocare concretamente le risorse pubbliche del territorio.",
        explanation: "Coinvolgere direttamente le comunità nella decisione su come spendere una quota della spesa pubblica restituisce centralità ai cittadini rispetto alle élite burocratiche.",
        options: [
          { text: "A) L'istituzione di forme stabili di consultazione dei cittadini, come i 'budget partecipativi'.", correct: true },
          { text: "B) La chiusura delle piattaforme online di consultazione per evitare interferenze nel processo legislativo.", correct: false },
          { text: "C) L'obbligo di ignorare le petizioni popolari se queste non sono approvate preventivamente dalle lobby locali.", correct: false },
          { text: "D) La nomina di commissari straordinari esterni per decidere gli investimenti nei territori.", correct: false }
        ]
      }
    ];

    let userAnswers = {};

    function toggleHint(qIndex) {
      const hintBox = document.getElementById(`hint-${qIndex}`);
      const hintBtn = document.getElementById(`hint-btn-${qIndex}`);
      if (hintBox.classList.contains("show")) {
        hintBox.classList.remove("show");
        hintBtn.innerHTML = "💡 Mostra Suggerimento";
      } else {
        hintBox.classList.add("show");
        hintBtn.innerHTML = "💡 Nascondi Suggerimento";
      }
    }

    function initQuiz() {
      userAnswers = {};
      const container = document.getElementById("quiz-container");
      const scoreSection = document.getElementById("score-section");
      scoreSection.classList.remove("show");
      container.innerHTML = "";

      questions.forEach((q, qIndex) => {
        const card = document.createElement("div");
        card.className = "card";
        card.id = `card-${qIndex}`;

        // Barra con categoria e pulsante suggerimento
        const topBar = document.createElement("div");
        topBar.className = "card-top-bar";

        const cat = document.createElement("div");
        cat.className = "question-category";
        cat.textContent = q.category;

        const hintBtn = document.createElement("button");
        hintBtn.className = "hint-toggle-btn";
        hintBtn.id = `hint-btn-${qIndex}`;
        hintBtn.type = "button";
        hintBtn.innerHTML = "💡 Mostra Suggerimento";
        hintBtn.onclick = () => toggleHint(qIndex);

        topBar.appendChild(cat);
        topBar.appendChild(hintBtn);

        // Box del suggerimento (nascosto di default)
        const hintBox = document.createElement("div");
        hintBox.className = "hint-box";
        hintBox.id = `hint-${qIndex}`;
        hintBox.innerHTML = `<div class="hint-title">💡 Suggerimento</div><div>${q.hint}</div>`;

        // Titolo della domanda
        const title = document.createElement("div");
        title.className = "question-title";
        title.textContent = q.question;

        // Blocco opzioni di risposta
        const optionsDiv = document.createElement("div");
        optionsDiv.className = "options";

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerHTML = opt.text;
          btn.onclick = () => selectOption(qIndex, optIndex);
          optionsDiv.appendChild(btn);
        });

        // Banner sintetico esito
        const feedback = document.createElement("div");
        feedback.className = "feedback-banner";
        feedback.id = `feedback-${qIndex}`;

        // Casella spiegazione dettagliata
        const explanationBox = document.createElement("div");
        explanationBox.className = "explanation-box";
        explanationBox.id = `explanation-${qIndex}`;
        explanationBox.innerHTML = `<strong>Spiegazione dettagliata:</strong>${q.explanation}`;

        card.appendChild(topBar);
        card.appendChild(hintBox);
        card.appendChild(title);
        card.appendChild(optionsDiv);
        card.appendChild(feedback);
        card.appendChild(explanationBox);
        container.appendChild(card);
      });
    }

    function selectOption(qIndex, selectedOptIndex) {
      if (userAnswers[qIndex] !== undefined) return;

      userAnswers[qIndex] = selectedOptIndex;
      const q = questions[qIndex];
      const card = document.getElementById(`card-${qIndex}`);
      const buttons = card.querySelectorAll(".option-btn");
      const feedback = document.getElementById(`feedback-${qIndex}`);
      const explanationBox = document.getElementById(`explanation-${qIndex}`);
      const isCorrect = q.options[selectedOptIndex].correct;

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (q.options[idx].correct) {
          btn.classList.add("correct");
        } else if (idx === selectedOptIndex) {
          btn.classList.add("wrong");
        }
      });

      feedback.classList.add("show", isCorrect ? "correct" : "wrong");
      feedback.textContent = isCorrect 
        ? "✓ Risposta corretta!" 
        : "✗ Risposta errata. L'opzione corretta è stata evidenziata in verde.";

      if (isCorrect) {
        explanationBox.classList.add("show");
      }

      if (Object.keys(userAnswers).length === questions.length) {
        showFinalScore();
      }
    }

    function showFinalScore() {
      let rawScore = 0;
      questions.forEach((q, idx) => {
        if (q.options[userAnswers[idx]].correct) {
          rawScore++;
        }
      });

      const starsEarned = Math.max(0, rawScore);

      const scoreSection = document.getElementById("score-section");
      const scoreHeading = document.getElementById("score-heading");
      const starsContainer = document.getElementById("stars-display");
      const scoreRatingLabel = document.getElementById("score-rating-label");
      const scoreFeedback = document.getElementById("score-feedback");

      starsContainer.innerHTML = "";
      starsContainer.classList.remove("shining");

      const starSvg = `
        <svg class="star-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>
      `;

      for (let i = 1; i <= 5; i++) {
        const divWrapper = document.createElement("div");
        divWrapper.innerHTML = starSvg.trim();
        const svgEl = divWrapper.firstChild;
        if (i <= starsEarned) {
          svgEl.classList.add("active");
        }
        starsContainer.appendChild(svgEl);
      }

      scoreRatingLabel.textContent = `Valutazione: ${starsEarned} su 5 Stelle`;

      if (rawScore === 5) {
        starsContainer.classList.add("shining");
        scoreHeading.textContent = "★ Congratulazioni! Punteggio Pieno! ★";
        scoreFeedback.textContent = "Eccellente! Conosci in modo impeccabile tutte le proposte programmatiche di NOVA 2026. Ti meriti 5 Stelle!";
      } else if (rawScore === 0) {
        scoreHeading.textContent = "Peccato! Nessuna stella!";
        scoreFeedback.textContent = "Valutazione bassa: ti invitiamo a ripassare il programma approvato e a ripetere la verifica.";
      } else if (rawScore >= 3) {
        scoreHeading.textContent = "Quiz Completato!";
        scoreFeedback.textContent = "Buon risultato! Hai dimostrato una buona conoscenza delle battaglie e dei pilastri di NOVA 2026.";
      } else {
        scoreHeading.textContent = "Quiz Completato!";
        scoreFeedback.textContent = "Valutazione base: ti invitiamo a ripassare i punti votati a NOVA e a ripetere la verifica.";
      }

      scoreSection.classList.add("show");
      scoreSection.scrollIntoView({ behavior: "smooth" });
    }

    window.onload = initQuiz;
  </script>
</body>
</html>
